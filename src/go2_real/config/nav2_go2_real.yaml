# Nav2 parameters for the real Go2 (DottorCane), without a prior map.
#
# Started by `go2_real_nav.launch.py` on a workstation, over zenoh to the robot.
# Same planner, controller and limits as config/nav2_go2.yaml of go2_sim_worlds
# (the simulation), with:
#   - no AMCL / map_server: LIO-SAM of the DottorCane stack publishes
#     map -> map, the EKF the odometry;
#   - /dottorcane/agent/scan_obstacles: the Mid-360 points 10-70 cm above the
#     floor as a 360 deg LaserScan in dottorcane/base_link (go2_real.launch.py on
#     the Jetson), for the costmaps and the collision monitor;
#   - a rolling global costmap (30 x 30 m) built from that scan only; with
#     map_topic:= the launch file adds the SLAM OccupancyGrid as static layer;
#   - wall-clock time: the clocks of the Jetson and the workstation must agree.
# Velocity chain: controller/behaviors -> cmd_vel_nav -> velocity_smoother ->
# cmd_vel_smoothed -> collision_monitor -> /dottorcane/go2_control/cmd_vel.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: dottorcane/base_link
    odom_topic: /dottorcane/slam/ekf_global/odometry
    bt_loop_duration: 10
    # ms to wait for a server to acknowledge a BT request. The default (20) aborts
    # whole navigations when Gazebo saturates the CPU and the planner answers late.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /dottorcane/slam/ekf_global/odometry
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    # Goals are rooms and frontiers: 0.4 m is plenty, and below ~0.15 m/s the gait
    # barely moves the body, so tighter tolerances end in "failed to make progress".
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Turn in place toward the path first (the gait cannot follow tight arcs).
      angular_dist_threshold: 0.6
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      # Regulated pure pursuit
      desired_linear_vel: 0.25
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: false
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: dottorcane/base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Body plus legs and the head.
      footprint: "[[0.36, 0.17], [0.36, -0.17], [-0.32, -0.17], [-0.32, 0.17]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Mid-360 obstacle scan (10-70 cm above the floor), NaN behind the robot.
        observation_sources: obstacles
        obstacles:
          topic: /dottorcane/agent/scan_obstacles
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          # Beams lie at z = 0 of base_link, already filtered by height.
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: dottorcane/base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.36, 0.17], [0.36, -0.17], [-0.32, -0.17], [-0.32, 0.17]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Mid-360 obstacle scan (10-70 cm above the floor), NaN behind the robot.
        observation_sources: obstacles
        obstacles:
          topic: /dottorcane/agent/scan_obstacles
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          # Beams lie at z = 0 of base_link, already filtered by height.
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: map
    global_frame: map
    robot_base_frame: dottorcane/base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # [x, y, theta]: the AgenticROS limits; reverse only for the backup behavior.
    max_velocity: [0.25, 0.0, 0.5]
    min_velocity: [-0.15, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: /dottorcane/slam/ekf_global/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: dottorcane/base_link
    odom_frame_id: map
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /dottorcane/go2_control/cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    # The scan arrives at ~10 Hz: stop if it goes missing over Wi-Fi.
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Last line of defence: stop when the scan sees something right at the body.
    polygons: [StopZone]
    StopZone:
      type: polygon
      points: "[[0.45, 0.22], [0.45, -0.22], [-0.35, -0.22], [-0.35, 0.22]]"
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_monitor_stop_zone
      enabled: true
    observation_sources: [obstacles]
    obstacles:
      type: scan
      topic: /dottorcane/agent/scan_obstacles
      # The beams lie at z = 0 of dottorcane/base_link, already filtered by height.
      min_height: -0.5
      max_height: 0.5
      enabled: true

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 10.0
    node_names: [controller_server, planner_server, behavior_server, bt_navigator, velocity_smoother, collision_monitor]
