# Nav2 parameters for the Go2 (DottorCane) in Gazebo.
#
# Started by `go2_sim.launch.py nav:=map` (map_server + AMCL + navigation).
# Based on nav2_bringup/params/nav2_params.yaml (Jazzy 1.3) with:
#   - frames of the robot (map, dottorcane/base_link);
#   - /dottorcane/scan: a LaserScan made from the ZED depth image (110 deg,
#     0.15-8 m, about 0.39 m above the ground; there is no lidar), for AMCL;
#   - /dottorcane/scan_obstacles: the ZED depth points between 6 and 70 cm above
#     the floor, squashed into a LaserScan (scripts/depth_obstacle_scan.py), for
#     the costmaps and the collision monitor (low or thin obstacles the single
#     plane misses);
#   - the AgenticROS safety limits (0.25 m/s, 0.5 rad/s, config/agenticros.json);
#   - rotate in place, then regulated pure pursuit: CHAMP reaches about 65-70%
#     of the commanded speed, so the controller works closed loop on the pose.
# Velocity chain: controller/behaviors -> cmd_vel_nav -> velocity_smoother ->
# cmd_vel_smoothed -> collision_monitor -> /dottorcane/go2_control/cmd_vel.

map_server:
  ros__parameters:
    use_sim_time: true
    # yaml_filename is set by the launch file from config/environments.yaml.

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: map
    base_frame_id: dottorcane/base_link
    scan_topic: /dottorcane/scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # Odometry comes from the ground truth: little motion noise.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    laser_model_type: likelihood_field
    laser_min_range: 0.15
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    min_particles: 300
    max_particles: 1500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_a: 0.1
    update_min_d: 0.1
    save_pose_rate: 0.5
    tf_broadcast: true
    # Scans come from the depth camera at ~1-2 Hz with multi-second gaps in the
    # house: map->odom must stay valid between them or the controller aborts.
    transform_tolerance: 3.0
    do_beamskip: false
    # The launch file sets initial_pose from the spawn pose.
    set_initial_pose: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: dottorcane/base_link
    odom_topic: /map
    bt_loop_duration: 10
    # ms to wait for a server to acknowledge a BT request. The default (20) aborts
    # whole navigations when Gazebo saturates the CPU and the planner answers late.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /map
    # The ground-truth pose arrives at 10 Hz.
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    # Goals are rooms and frontiers: 0.4 m is plenty, and below ~0.15 m/s the gait
    # barely moves the body, so tighter tolerances end in "failed to make progress".
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Turn in place toward the path first (the gait cannot follow tight arcs).
      angular_dist_threshold: 0.6
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      # Regulated pure pursuit
      desired_linear_vel: 0.25
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: false
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: dottorcane/base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Body plus legs, the head and the ZED in front.
      footprint: "[[0.36, 0.17], [0.36, -0.17], [-0.32, -0.17], [-0.32, 0.17]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Point-cloud obstacle scan (6-70 cm above the floor). The single-plane
        # /dottorcane/scan would clear low obstacles it passes over.
        observation_sources: obstacles
        obstacles:
          topic: /dottorcane/scan_obstacles
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          # Beams lie at z = 0 of base_ground; the map frame (AMCL/SLAM) sits lower.
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: dottorcane/base_link
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.36, 0.17], [0.36, -0.17], [-0.32, -0.17], [-0.32, 0.17]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Point-cloud obstacle scan (6-70 cm above the floor). The single-plane
        # /dottorcane/scan would clear low obstacles it passes over.
        observation_sources: obstacles
        obstacles:
          topic: /dottorcane/scan_obstacles
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          # Beams lie at z = 0 of base_ground; the map frame (AMCL/SLAM) sits lower.
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: map
    global_frame: map
    robot_base_frame: dottorcane/base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # [x, y, theta]: the AgenticROS limits; reverse only for the backup behavior.
    max_velocity: [0.25, 0.0, 0.5]
    min_velocity: [-0.15, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: /map
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: dottorcane/base_link
    odom_frame_id: map
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /dottorcane/go2_control/cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 3.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Last line of defence: stop when the scan sees something right at the body.
    polygons: [StopZone]
    StopZone:
      type: polygon
      points: "[[0.45, 0.22], [0.45, -0.22], [-0.35, -0.22], [-0.35, 0.22]]"
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_monitor_stop_zone
      enabled: true
    observation_sources: [obstacles]
    obstacles:
      type: scan
      topic: /dottorcane/scan_obstacles
      # Heights in dottorcane/base_link: the beams lie on the floor plane, ~0.22 m below.
      min_height: -0.5
      max_height: 0.5
      enabled: true

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 10.0
    node_names: [map_server, amcl]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 10.0
    node_names: [controller_server, planner_server, behavior_server, bt_navigator, velocity_smoother, collision_monitor]
