# ros_gz_bridge topics for the Go2 (DottorCane), shared by every world.
# Same as ldc25-sim/config/ldc25_bridge.yaml without the LDC25-only PTZ camera.
---
# Gazebo Groundtruth
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
- ros_topic_name: "/gz/dottorcane/pose"
  gz_topic_name: "/model/dottorcane/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS
# Dottorcane Controller
- ros_topic_name: "/dottorcane/joint_trajectory"
  gz_topic_name: "/model/dottorcane/joint_trajectory"
  ros_type_name: "trajectory_msgs/msg/JointTrajectory"
  gz_type_name: "gz.msgs.JointTrajectory"
  direction: ROS_TO_GZ
# Dottorcane Sensors
- ros_topic_name: "/dottorcane/joint_states"
  gz_topic_name: "/model/dottorcane/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
- ros_topic_name: "/dottorcane/slam/zed_x_driver/imu"
  gz_topic_name: "/dottorcane/slam/zed_x_driver/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
- ros_topic_name: "/dottorcane/slam/zed_x_driver/left/image_rect_color"
  gz_topic_name: "/dottorcane/slam/zed_x_driver/left/image_rect_color/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/dottorcane/slam/zed_x_driver/left/camera_info"
  gz_topic_name: "/dottorcane/slam/zed_x_driver/left/image_rect_color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
# Cameras nothing uses (right ZED, side cameras): lazy, so Gazebo does not
# render them unless someone subscribes. Rendering is the bottleneck in the house.
- ros_topic_name: "/dottorcane/slam/zed_x_driver/right/image_rect_color"
  gz_topic_name: "/dottorcane/slam/zed_x_driver/right/image_rect_color/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/dottorcane/slam/zed_x_driver/right/camera_info"
  gz_topic_name: "/dottorcane/slam/zed_x_driver/right/image_rect_color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/dottorcane/slam/zed_x_driver/depth_distances"
  gz_topic_name: "/dottorcane/slam/zed_x_driver/left/sd/image_rect_color/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
# Intrinsics of the depth image (672x376), needed to turn it into a LaserScan for Nav2
- ros_topic_name: "/dottorcane/slam/zed_x_driver/depth_camera_info"
  gz_topic_name: "/dottorcane/slam/zed_x_driver/left/sd/image_rect_color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
# ~250k points per frame: converted only while someone subscribes (lazy),
# otherwise the bridge spends its time here and slows every other topic.
- ros_topic_name: "/dottorcane/slam/zed_x_driver/point_cloud"
  gz_topic_name: "/dottorcane/slam/zed_x_driver/left/sd/image_rect_color/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/dottorcane/sensors/left_camera_driver/image_rect_color"
  gz_topic_name: "/dottorcane/sensors/left_camera/image_rect_color"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/dottorcane/sensors/left_camera_driver/camera_info"
  gz_topic_name: "/dottorcane/sensors/left_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/dottorcane/sensors/right_camera_driver/image_rect_color"
  gz_topic_name: "/dottorcane/sensors/right_camera/image_rect_color"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: "/dottorcane/sensors/right_camera_driver/camera_info"
  gz_topic_name: "/dottorcane/sensors/right_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true